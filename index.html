<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="avatar">

    <h1 class="container__item-flex title">Jessica Randall</h1>
    <p class="container__item-flex sub-title">London, United Kingdom</p>
    <p class="container__item-flex paragraph">"Front-end developer and avid reader."</p>

    <p class="container__button" href="#">GitHub</p>
    <p class="container__button" href="#">Frontend Mentor</p>
    <p class="container__button" href="#">LinkedIn</p>
    <p class="container__button" href="#">Twitter</p>
    <p class="container__button" href="#">Instagram</p>

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.

      <p class="attribution">
        Coded by <a href="https://www.linkedin.com/in/pedro-augusto-b8a30514b/">Pedro Augusto</a>.
      </p>
    </div>
  </div>
</body>

</html>
